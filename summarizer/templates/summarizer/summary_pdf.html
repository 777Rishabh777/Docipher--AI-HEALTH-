<!DOCTYPE html>
<html>
<head>
    <style>
        @page { size: A4; margin: 1cm; }
        body { font-family: Helvetica, sans-serif; color: #333; line-height: 1.5; }
        
        .header { text-align: center; border-bottom: 3px solid #0ea5e9; padding-bottom: 20px; margin-bottom: 30px; }
        .logo { font-size: 24px; font-weight: bold; color: #0ea5e9; }
        
        .box {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 10px;
        }
        
        /* Typography */
        h3 { color: #0ea5e9; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 20px; font-size: 18px; }
        h4 { color: #10b981; margin-top: 15px; margin-bottom: 10px; font-size: 16px; }
        h5 { color: #334155; margin-top: 15px; margin-bottom: 5px; font-size: 14px; }
        p, li { font-size: 13px; color: #475569; }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { border: 1px solid #e2e8f0; padding: 8px; font-size: 12px; }
        th { background-color: #f8fafc; color: #1e293b; font-weight: bold; }
        tr:nth-child(even) td { background-color: #f8fafc; }
        
        /* Progress Bars */
        .progress {
            background-color: #e2e8f0;
            width: 100%;
            height: 12px;
            margin-top: 4px;
            margin-bottom: 12px;
            border-radius: 6px;
            display: block;
        }
        .progress-bar {
            height: 12px;
            display: block;
            border-radius: 6px;
        }
        
        /* Colors & Badges */
        .bg-success { background-color: #10b981 !important; color: white; }
        .bg-danger { background-color: #ef4444 !important; color: white; }
        .bg-warning { background-color: #f59e0b !important; color: white; }
        .bg-primary { background-color: #0ea5e9 !important; color: white; }
        .bg-info { background-color: #3b82f6 !important; color: white; }
        
        .text-success { color: #10b981 !important; }
        .text-danger { color: #ef4444 !important; }
        .text-warning { color: #f59e0b !important; }
        .text-primary { color: #0ea5e9 !important; }
        
        .badge {
            padding: 3px 6px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 4px;
            display: inline-block;
            text-align: center;
        }
        
        /* Utility */
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .mt-3 { margin-top: 12px; }
        .mt-4 { margin-top: 16px; }
        .ms-3 { margin-left: 12px; }
        .text-muted { color: #94a3b8; }
        
        .footer { position: fixed; bottom: 0; width: 100%; text-align: center; font-size: 10px; color: #999; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🩺 Docipher Medical Report</div>
        <p>Generated for: {{ user.username }} | Date: {% now "d M Y" %}</p>
    </div>

    <div class="box">
        {{ summary_text|safe }}
    </div>

    {% if image_url %}
    <div style="margin-top: 30px; text-align: center;">
        <h4>Attached Source Image</h4>
        <img src=".{{ image_url }}" style="max-width: 500px; border: 1px solid #999;">
    </div>
    {% endif %}

    <div class="footer">
        Generated by AI. Consult a doctor for professional advice.
    </div>
</body>
</html>
