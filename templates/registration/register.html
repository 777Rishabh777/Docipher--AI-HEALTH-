{% extends 'base_auth.html' %}

{% block title %}Register | Docipher{% endblock %}

{% block content %}
<div class="container mx-auto px-6 relative z-10">
    <div class="max-w-xl mx-auto" data-aos="zoom-in" data-aos-duration="600">
        <div class="glass-card p-8 rounded-2xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-primary/20 rounded-full flex items-center justify-center mx-auto mb-4 text-primary text-2xl shadow-[0_0_15px_rgba(99,102,241,0.5)]">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Create an Account</h2>
                <p class="text-sm text-gray-400">Join Docipher for personalized healthcare insights</p>
            </div>

            <form method="post" class="space-y-5">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1" for="id_first_name">First Name</label>
                        <input type="text" name="first_name" id="id_first_name" class="w-full px-4 py-3 rounded-lg input-floating" placeholder="John" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1" for="id_last_name">Last Name</label>
                        <input type="text" name="last_name" id="id_last_name" class="w-full px-4 py-3 rounded-lg input-floating" placeholder="Doe" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1" for="id_username">Username</label>
                        <input type="text" name="username" id="id_username" class="w-full px-4 py-3 rounded-lg input-floating" placeholder="johndoe123" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1" for="id_email">Email</label>
                        <input type="email" name="email" id="id_email" class="w-full px-4 py-3 rounded-lg input-floating" placeholder="john@example.com" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1" for="id_password1">Password</label>
                        <input type="password" name="password1" id="id_password1" class="w-full px-4 py-3 rounded-lg input-floating" placeholder="••••••••" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1" for="id_password2">Confirm Password</label>
                        <input type="password" name="password2" id="id_password2" class="w-full px-4 py-3 rounded-lg input-floating" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="w-full py-3 px-4 mt-4 bg-primary hover:bg-indigo-600 text-white rounded-lg font-medium transition shadow-lg shadow-indigo-500/30">
                    Create Account
                </button>
            </form>
            
            <p class="mt-6 text-center text-sm text-gray-400">
                Already have an account? <a href="{% url 'login' %}" class="text-primary hover:text-indigo-400 transition font-medium">Log in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
