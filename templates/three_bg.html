<!-- Three.js Background Snippet -->
<div id="three-bg-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const container = document.getElementById('three-bg-container');
    if (!container) return;

    const scene = new THREE.Scene();
    
    // Add subtle fog to blend into the background colors
    const isDark = document.documentElement.classList.contains('dark');
    scene.fog = new THREE.FogExp2(isDark ? 0x0f172a : 0xf0fdfa, 0.002);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.z = 200;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Particle Group
    const particleGroup = new THREE.Group();
    scene.add(particleGroup);

    // Geometry and Material
    const geometry = new THREE.BufferGeometry();
    const particleCount = 400; // Optimal for performance
    
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    
    const colorPrimary = new THREE.Color(0x0ea5e9);
    const colorAccent = new THREE.Color(0x10b981);

    for (let i = 0; i < particleCount * 3; i += 3) {
        // Random spread
        positions[i] = (Math.random() - 0.5) * 600;
        positions[i+1] = (Math.random() - 0.5) * 600;
        positions[i+2] = (Math.random() - 0.5) * 600;

        // Mix colors
        const mixedColor = colorPrimary.clone().lerp(colorAccent, Math.random());
        colors[i] = mixedColor.r;
        colors[i+1] = mixedColor.g;
        colors[i+2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Particle Material
    const material = new THREE.PointsMaterial({
        size: 2,
        vertexColors: true,
        transparent: true,
        opacity: 0.6,
        sizeAttenuation: true
    });

    const particles = new THREE.Points(geometry, material);
    particleGroup.add(particles);

    // Connect close particles with lines (DNA / Neural network effect)
    const lineMaterial = new THREE.LineBasicMaterial({
        color: 0x0ea5e9,
        transparent: true,
        opacity: 0.1
    });

    // Mouse Interaction
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;

    const windowHalfX = window.innerWidth / 2;
    const windowHalfY = window.innerHeight / 2;

    document.addEventListener('mousemove', (event) => {
        mouseX = (event.clientX - windowHalfX) * 0.05;
        mouseY = (event.clientY - windowHalfY) * 0.05;
    });

    // Animation Loop
    function animate() {
        requestAnimationFrame(animate);

        targetX = mouseX * 0.5;
        targetY = mouseY * 0.5;

        // Smooth camera movement based on mouse
        camera.position.x += (targetX - camera.position.x) * 0.05;
        camera.position.y += (-targetY - camera.position.y) * 0.05;
        camera.lookAt(scene.position);

        // Slowly rotate particle group
        particleGroup.rotation.y += 0.001;
        particleGroup.rotation.x += 0.0005;

        // Update colors based on theme
        const currentIsDark = document.documentElement.classList.contains('dark');
        if (currentIsDark && scene.fog.color.getHex() !== 0x0f172a) {
            scene.fog.color.setHex(0x0f172a);
        } else if (!currentIsDark && scene.fog.color.getHex() !== 0xf0fdfa) {
            scene.fog.color.setHex(0xf0fdfa);
        }

        renderer.render(scene, camera);
    }
    
    animate();

    // Resize handler
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
});
</script>
